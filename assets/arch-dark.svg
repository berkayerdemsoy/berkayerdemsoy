<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1780 560" width="1780" height="560" role="img" aria-labelledby="t d">
<title id="t">Akissy topology</title>
<desc id="d">Requests enter through the Traefik gateway; services call each other over REST, publish events to Kafka, and register with Eureka.</desc>
<style>@font-face{font-family:"Geist Mono";font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format("woff")}text{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;white-space:pre}.lbl{fill:#e6edf3;font-size:28px}.dim{fill:#7d8590;font-size:22px}.box{fill:#161b22;stroke:#30363d;stroke-width:2}.bus{fill:#161b22;stroke:#f2b38a;stroke-width:2}.reg{fill:#161b22;stroke:#7d8590;stroke-width:2;stroke-dasharray:6 6}.ln{stroke:#30363d;stroke-width:2;fill:none}.hb{stroke:#7d8590;stroke-width:2;stroke-dasharray:4 8;fill:none}.sync{fill:#5fd3ff}.async{fill:#f2b38a}.beat{fill:#7d8590}.live{fill:#ffe4a3}.pulse{animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}@media (prefers-reduced-motion:reduce){.pulse{animation:none}.pkt{display:none}}</style>
